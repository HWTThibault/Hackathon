<style>
  /* Eén donkere raadzaal: bewust enkel donker thema, alle kleuren expliciet. */
  :root { color-scheme: dark; --grond: #0b0c14; --tekst: #e9eaf3; --zacht: #8d92ad; --accent: #a893ff; --paneel: rgba(22, 24, 38, .72); --lijn: rgba(168, 147, 255, .28); }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--grond); color: var(--tekst); overflow: hidden; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .budget { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); display: flex; gap: 7px; }
  .budget i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--lijn); transition: background .4s, border-color .4s, box-shadow .4s; }
  .budget i.vol { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .knoppen { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; padding: 6px; border-radius: 999px; background: var(--paneel); border: 1px solid var(--lijn); backdrop-filter: blur(8px); }
  .knoppen button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--tekst); display: grid; place-items: center; cursor: pointer; font: 600 13px/1 system-ui, sans-serif; }
  .knoppen a { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--tekst); }
  .knoppen button:hover, .knoppen a:hover { background: rgba(168, 147, 255, .16); }
  .knoppen a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .knoppen button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .knoppen svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tip { position: fixed; pointer-events: none; padding: 4px 10px; border-radius: 999px; background: var(--paneel); border: 1px solid var(--lijn); font-weight: 600; transform: translate(-50%, -140%); white-space: nowrap; }
  .melding { position: fixed; inset: 0; display: grid; place-items: center; color: var(--zacht); }
  .knoppen button[aria-pressed="false"] { opacity: .5; }
  /* Tekstpaneel: wat er op dit moment gezegd wordt */
  .paneel { position: fixed; top: calc(50px + env(safe-area-inset-top, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); width: min(400px, calc(100vw - 36px));
    max-height: calc(100vh - 150px); overflow-y: auto; background: var(--paneel); border: 1px solid var(--lijn); border-radius: 16px; backdrop-filter: blur(10px);
    padding: 14px 16px; display: grid; gap: 10px; transition: opacity .35s; }
  .paneel:empty { display: none; }
  @media (max-width: 720px) { .paneel { top: auto; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); max-height: 42vh; } }
  .kop { display: flex; align-items: center; gap: 8px; font-weight: 650; flex-wrap: wrap; }
  .kop .pijl { color: var(--zacht); font-weight: 400; }
  .kop .nr { margin-left: auto; color: var(--zacht); font-weight: 400; font-size: 12px; }
  .av { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; color: var(--k);
    background: color-mix(in srgb, var(--k) 18%, #151725); border: 1.5px solid color-mix(in srgb, var(--k) 55%, transparent); }
  .av svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .vraag { font-size: 15px; }
  .reden { color: var(--zacht); font-size: 13px; }
  .reden b { color: var(--tekst); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 12px/1.4 ui-monospace, Consolas, monospace; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--lijn); color: var(--zacht); overflow-wrap: anywhere; }
  .chip b { color: var(--tekst); font-weight: 600; }
  .tekst { font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; border-left: 3px solid var(--k); padding-left: 10px; }
  .id { font: 600 11.5px/1.5 ui-monospace, Consolas, monospace; padding: 0 5px; border-radius: 5px; color: var(--k);
    background: color-mix(in srgb, var(--k) 16%, transparent); border: 1px solid color-mix(in srgb, var(--k) 40%, transparent); white-space: nowrap; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--zacht); font-weight: 650; }
  .deel { display: grid; gap: 3px; font-size: 13px; }
  .zeker { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 11.5px; color: var(--zacht); font-variant-numeric: tabular-nums; }
  .zeker i { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; display: block; }
  .zeker i span { display: block; height: 100%; background: var(--accent); }
  .dag { font-size: 26px; font-weight: 700; color: var(--accent); }
  .paneel ol { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; }
  /* Groot scherm of beamer in 4K: alles wat je leest schaalt mee */
  @media (min-width: 2000px) { .paneel, .knoppen, .budget, .tip { zoom: 1.4; } }
  @media (min-width: 2800px) { .paneel, .knoppen, .budget, .tip { zoom: 1.9; } }
  .verschijn { animation: verschijn .45s ease-out; }
  @keyframes verschijn { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .verschijn { animation: none; } }
</style>

const INGEBED_TRACE = {"run_id":"2026-11-24T14:16:14+01:00_4e8ba0fe","status":"klaar","raadsleden":["archmage","beast_master","engineer","guardian_keeper","historian","oracle"],"beurten":[{"nr":1,"soort":"routering","spreker":"koning","aan":"engineer","vraag":"Welke afwijkingen zie jij in de logs van het datanet, op welke momenten, en welke handelingen of wijzigingen door wie gingen daaraan vooraf?","reden":"Het debat is nog leeg, dus we hebben geen eerste waarnemingen. De datatoren-logs leggen handelingen en tijdstippen vast, en dat is nodig om een ingreep van een symptoom te onderscheiden."},{"nr":2,"soort":"toolcall","spreker":"engineer","tool":"lees_kennisbron","argumenten":{}},{"nr":3,"soort":"bericht","spreker":"engineer","tekst":"**Waarnemingen (tijd zoals de bron noteert):**\n- Dag 10, 02:40: hulpslag geactiveerd door mij (ENG-011). Dag 10, 03:00: doorvoer +38% (ENG-012).\n- Dag 10, 04:50: klacht uit de benedenstad over \"half aangekomen\" berichten (ENG-107, alleen in het werkboek, geen CSV-entry).\n- Dag 22, 04:15: 3 minuten pakketverlies op poort oost (ENG-026, fout). Dag 22, 04:20: firewall aangescherpt (ENG-027).\n- Dag 24, 11:00: hulpslag 5% opgedreven door mij (ENG-029, ENG-062).\n\n**Interpretatie:** De eerste klacht kwam twee uur na mijn activatie. Dat past bij een verband tussen de ingreep en de storing, maar één samenvallen is geen bewijs. Mijn Belang bij het datanet en het feit dat de hulpslag mijn werk is, kleuren dit. Ik heb de klacht toen als kinderziekte afgedaan (ENG-107). Mijn hackerverklaring voor dag 22 (ENG-110) is niet getoetst.\n\n**Tegenspraak:** ENG-120 meldt dag 16 dat de doorvoer nog steeds 38% hoger ligt. Dat past niet bij een structurele storing door de hulpslag.\n\n**Wat ik niet weet:** Mijn bron bevat geen verliesmetingen per dag, en dagen 11–21 zijn alleen via het werkboek gedekt. Het woord \"desync\" staat niet in mijn bron.\n\n**Open vraag aan de Historian:** Heeft u berichtlogs van dag 10 rond 04:50 en dag 22 rond 04:15, zodat we kunnen vaststellen of de verliezen samenvallen met de hulpslag?"},{"nr":4,"soort":"routering","spreker":"koning","aan":"historian","vraag":"Heeft u berichtlogs van dag 10 rond 04:50 en dag 22 rond 04:15, zodat we kunnen vaststellen of de verliezen samenvallen met de hulpslag (ENG-011) en de pakketverliezen op poort oost (ENG-026)?","reden":"De Engineer wijst zelf op een mogelijke samenloop van de hulpslag en de klachten, maar haar eigen verklaringen zijn niet getoetst. Het archief kan berichtlogs leveren die dat onafhankelijk bevestigen of weerleggen."},{"nr":5,"soort":"toolcall","spreker":"historian","tool":"lees_kennisbron","argumenten":{}},{"nr":6,"soort":"bericht","spreker":"historian","tekst":"**Waarneming (mijn bron bevat geen berichtlogs; dit zijn de dichtstbijzijnde records):**\n- HIS-035: dag 10 04:45 stokte de Burchtader, gemeld door de nachtwake. Vastgelegd dag 10 07:20.\n- HIS-036: dag 10 04:50 klacht uit de benedenstad over half aangekomen berichten. Vastgelegd dag 9 23:55, dus vóór het gebeuren.\n- HIS-053: dag 22 04:15 lek bij poort oost, 3 minuten. Vastgelegd dag 22 01:50, ook vóór het gebeuren.\n- HIS-054: dag 22 05:00 ochtendgebed bij de Burchtader. Vastgelegd dag 22 07:25.\n- HIS-014 en HIS-105: geen wijziging aan de woudkabels of datatoren.\n\n**Interpretatie:** HIS-036 en HIS-053 zijn in strijd met HIS-103, dat vastgelegd_op gelijk aan gebeurd_op stelt. Mijn Belang in de integriteit van het archief neigt ertoe deze tijdstempels als klerkenfouten af te doen (HIS-112, HIS-116). Dat wil ik niet doen zonder onderzoek. Mijn eerdere uitspraak in HIS-114 over een terugkerende Stille Winter wordt door geen enkel record gedragen; ik trek die niet terug, maar behandel haar als onbewezen.\n\n**Wat ik niet weet:** Ik kan niet vaststellen of de verliezen samenvallen met de hulpslag. ENG-011, ENG-026 en ENG-120 staan niet in mijn bron. Voor dagen 11–21 heb ik nauwelijks tijdstempels en geen verliesmetingen.\n\n**Open vraag aan de Engineer:** Kunt u de bron van de hulpslagactivatie (ENG-011, dag 10 02:40) vergelijken met de vastlegtijden van HIS-036 en HIS-053? Dan zien we of de tijdstempels systematisch verschuiven."},{"nr":7,"soort":"routering","spreker":"koning","aan":"beast_master","vraag":"Meldden de dieren van het woud onrust op dag 10 tussen 02:40 en 04:50, en op dag 22 rond 04:15, en valt die onrust samen met de hulpslag (ENG-011) en het lek bij poort oost (ENG-026)?","reden":"De Beast Master merkt verstoringen eerst aan onrust en kan de tijdstempels van de hulpslag en de klachten toetsen met een bron die niet van het datanet of het archief afhangt. Dat is de onafhankelijke waarneming die nu ontbreekt."},{"nr":8,"soort":"toolcall","spreker":"beast_master","tool":"lees_kennisbron","argumenten":{}},{"nr":9,"soort":"bericht","spreker":"beast_master","tekst":"**Waarneming (mijn bron):**\n- **Dag 10:** geen registratie tussen 02:40 en 04:40. Om 04:40 slaan wolven aan, onrust 4 (BEA-019). Om 04:50 vluchten herten, onrust 4 (BEA-020). BEA-106 beschrijft hetzelfde.\n- **Dag 22:** om 04:15 slaan wolven aan, onrust 4 (BEA-046). Om 04:20 vluchten herten (BEA-047). Zie ook BEA-113.\n- Volgens BEA-113 keert dit elke vierde nacht terug sinds dag 10, ook buiten de gevraagde dagen: dag 14 04:20 (BEA-028), dag 26 04:35 (BEA-055), dag 38 04:20 (BEA-082).\n\n**Samenval:** Dag 22 valt samen met ENG-026 (04:15) en ENG-027 (04:20), uit het debat en niet in mijn bron. Op dag 10 begint de onrust om 04:40, twee uur na ENG-011 (02:40).\n\n**Interpretatie en tegenspraak:** In BEA-109 schreef ik de onrust toe aan de kabels. Dat kleurt door mijn Belang. De kabels lagen er al op dag 3 (BEA-102), en op dag 6 meldde ik nog rustige nachten (BEA-104). Dat verklaart het begin op dag 10 niet. Ook na de firewall op dag 22 bleef de onrust bestaan (BEA-055, dag 26).\n\n**Niet weten:** wat er op dag 10 tussen 02:40 en 04:40 veranderde.\n\n**Open vraag aan de Engineer:** Welke wijziging aan de hulpslag of de kabels vond plaats op dag 10 tussen 02:40 en 04:40?"},{"nr":10,"soort":"routering","spreker":"koning","aan":"guardian_keeper","vraag":"Was er op dag 10 tussen 02:40 en 04:50, en op dag 22 rond 04:15, een bres, lek of aanval bij de schilden van poort oost, en wat was de oorzaak volgens de schildlogs?","reden":"De hackerverklaring voor dag 22 (ENG-110) is niet getoetst, en de Guardian Keeper bewaakt de schilden met een eigen bron die los staat van het datanet en het archief. Een bres die iemand sloeg zou de hackerhypothese bevestigen of weerleggen, en een schild zonder bres wijst eerder op een interne ingreep."},{"nr":11,"soort":"toolcall","spreker":"guardian_keeper","tool":"lees_kennisbron","argumenten":{}},{"nr":12,"soort":"bericht","spreker":"guardian_keeper","tekst":"**Waarneming:** Geen bres van buitenaf. Dag 10 betreft niet poort oost maar de benedenstad: dag 10, 04:47, \"van binnenuit geopend, 2 minuten\", zegels intact, oorzaak niet vastgesteld (GUA-019; zie ook GUA-111). Dag 22, 04:15, poort oost: 3 minuten van binnenuit open, zegels intact, geen sporen van inbraak (GUA-043). Om 04:30 waren de zegels nog intact en was niemand buiten de muur gezien (GUA-044). Mijn bron heeft geen registratie van poort oost op dag 10 tussen 02:40 en 04:47.\n\n**Oorzaak:** Mijn bron noemt geen oorzaak. Artikel 3 laat verkeer dat midden tussen twee tikken valt als binnenverkeer door, zonder toets (GUA-104). Dat is ontwerp, geen breuk (GUA-120). Of iemand het verkeer zo timede, kan ik niet vaststellen.\n\n**Tegenspraak en Belang:** Ik schreef \"geen reden tot ongerustheid\" (GUA-111) en \"ik ben er zeker\" over een infiltrant (GUA-116). Beide zijn niet bewezen en kleuren door mijn Belang bij de schilden. De melding van 01:50, vóór de opening op dag 22 (GUA-115), heb ik als klerkenfout afgedaan. Ook dat is onbewezen.\n\n**Tijd:** Beide openingen vallen in 03:00–06:00, het uur waarin de poorten zonder ronde staan (GUA-106).\n\n**Niet weten:** de timing van de Kroonklok en het verkeer op die nachten.\n\n**Open vraag aan de Engineer:** Veranderde de doorvoer of de hulpslag het moment waarop verkeer bij poort oost en de benedenstad aankomt, ten opzichte van de tik?"},{"nr":13,"soort":"routering","spreker":"koning","aan":"oracle","vraag":"Toont uw bron een vaste tussentijd tussen de nachten van de onrust op dag 10, 14, 22, 26 en 38 (BEA-019, BEA-028, BEA-046, BEA-055, BEA-082), of is het ritme 'elke vierde nacht' (BEA-113) een interpretatie die de tussenpozen van 4, 8, 4 en 12 dagen niet dekt?","reden":"De Beast Master meldt een ritme van elke vierde nacht (BEA-113), maar de genoemde dagen geven ongelijke tussenpozen. Een tweede Rol moet bevestigen of er een vast patroon is voordat we een voorspelling op dat ritme bouwen."},{"nr":14,"soort":"toolcall","spreker":"oracle","tool":"lees_kennisbron","argumenten":{}},{"nr":15,"soort":"bericht","spreker":"oracle","tekst":"**Antwoord:** Mijn bron toont een vaste tussentijd van 4 dagen. Het ritme is geen interpretatie, maar het verschil ontstaat doordat de lijst in het debat dagen 18, 30, 34 en 42 mist. De BEA-IDs staan niet in mijn bron, dus ik kan die niet bevestigen.\n\n**Waarneming (ORA-dagboek, wakker om):**\n- Dag 10, 04:45 (ORA-110)\n- Dag 14, 04:20 (ORA-114)\n- Dag 18, 04:30 (ORA-118)\n- Dag 22, 04:15 (ORA-122)\n- Dag 26, 04:35 (ORA-126)\n- Dag 30, 04:25 (ORA-130)\n- Dag 34, 04:30 (ORA-134)\n- Dag 38, 04:20 (ORA-138)\n- Dag 42, 04:30 (ORA-142)\n\nDagen 1 tot 9 zijn rustig (ORA-101 tot ORA-109). Mijn dagboek noteert alleen de nachten waarin ik wakker werd, dus een zware nacht zonder vermelding is niet uitgesloten.\n\n**Interpretatie:** Elke zware nacht valt op dag 10 + 4n. Dat is een regelmatig patroon in mijn eigen aantekeningen.\n\n**Tegenspraak met mijn Belang:** Op dag 21 schreef ik dat de conjunctie van de Wachtsterren de oorzaak is en dat ik er zeker van ben (ORA-121). Dat is niet getoetst. Het ritme loopt door op dag 34 (ORA-134), na de conjunctie op dag 33 (ORA-133), en die conjunctie verklaart de regelmaat dus niet.\n\n**Wat ik niet weet:** waarom het ritme bestaat, en of het in de bronnen van andere Rollen terugkomt.\n\n**Open vraag aan de Beast Master:** Zijn er registraties op dag 18, 30, 34 en 42 die BEA-113 dekken? Zo ja, dan zie ik dezelfde 4-daagse reeks ook in uw bron."},{"nr":16,"soort":"routering","spreker":"koning","aan":"archmage","vraag":"Toont uw bron op dag 10 tussen 02:40 en 04:50, en op dag 22 rond 04:15, een verstoring van de leylijnen, en volgt die verstoring een vaste tussentijd van vier dagen (dag 10, 14, 18, 22, 26, 30, 34, 38, 42; ORA-110 t/m ORA-142)?","reden":"De Archmage is de enige Rol die nog niet heeft gesproken, en de leylijnen zijn een onafhankelijke bron naast het datanet, het archief en de schilden. Zo kunnen we toetsen of het viertallige ritme een magische klok heeft of dat de Oracle's Wachtsterren-verklaring (ORA-121) beter past."},{"nr":17,"soort":"toolcall","spreker":"archmage","tool":"lees_kennisbron","argumenten":{}},{"nr":18,"soort":"bericht","spreker":"archmage","tekst":"**Uw premisse klopt niet met mijn bron:** ik heb geen metingen op dag 10 of dag 22, en geen vaste tussentijd van vier dagen.\n\n**Waarneming** (wekelijkse metingen voor zonsopgang, geen uurtijden):\n- Dag 7: alle lijnen binnen de marge (ARC-001 t/m ARC-014, ARC-105).\n- Dag 14: alle lijnen laag (ARC-015 t/m ARC-028, ARC-109).\n- Dag 21, 28 en 35: normaal (ARC-029 t/m ARC-070).\n- Dag 42: weer alle lijnen laag (ARC-071 t/m ARC-084, ARC-116).\n- Dag 8: ARC-106 meldt dat de signaalmastlamp gedimd is en dat het net \"op eigen maat\" mag lopen, \"niet ruchtbaar maken\". Dat is twee dagen vóór dag 10. Zie ook ARC-102 (dag 2).\n\n**Interpretatie:** Lage lijnen op dag 14 en 42, maar niet op 21, 28 en 35. Dat past niet bij een vaste viertallige klok. Mijn Belang bij de zuiverheid van de magie kleurt dit sterk: ik schreef \"ik ben er zeker\" dat het datanet de leylijnen vervuilt (ARC-109, ARC-116). Dat is niet getoetst.\n\n**Tegenspraak:** ARC-114 meldt dat de Burchtader in de nacht van dag // ---------- Trace → stappen ----------
let traceData = null, verdictData = null, stappen = [], klaar = false, live = false;
function naarStappen(trace) {
  const rollen = trace.raadsleden || [];
  const uit = []; let nummer = 0, vraagNr = 0;
  for (const b of trace.beurten || []) {
    if (b.soort === "routering") uit.push(b.aan ? { t: "route", rol: b.aan, vraag: b.vraag, reden: b.reden, vraagNr: ++vraagNr } : { t: "stop", reden: b.reden });
    else if (b.soort === "toolcall" || b.soort === "bestand") {
      const laatste = uit[uit.length - 1];
      const call = b.soort === "toolcall" ? { tool: b.tool, argumenten: b.argumenten } : { tool: "bestand", argumenten: { pad: b.bestand } };
      if (laatste && laatste.t === "bron" && laatste.rol === b.spreker) { laatste.n++; laatste.calls.push(call); }
      else uit.push({ t: "bron", rol: b.spreker, n: 1, calls: [call] });
    } else if (b.soort === "bericht" && rollen.includes(b.spreker)) {
      nummer++;
      const ids = b.ids || [...new Set([...String(b.tekst || "").matchAll(ID_RE)].map(m => `${m[1]}-${m[2]}`))];
      uit.push({ t: "bijdrage", rol: b.spreker, ids, nummer, tekst: b.tekst });
    }
  }
  return uit;
}

async function speel(gen) {
  let i = 0;
  while (gen === generatie) {
    if (i < stappen.length) {
      const s = stappen[i++];
      if (s.t === "route") { await stapRoute(s, gen); await wacht(tekstAan ? 1800 : 0); }
      else if (s.t === "bron") await stapBron(s, gen);
      // Leestijd naar lengte van de bijdrage wanneer de tekst zichtbaar is
      else if (s.t === "bijdrage") { await stapBijdrage(s, gen); await wacht(tekstAan ? Math.min(9000, 2500 + (s.tekst || "").length * 6) : 350); }
      else if (s.t === "stop") { await stapVerdict(s, gen); return; }
      continue;
    }
    if (klaar) return;
    await wacht(400);
  }
}

function herstart() {
  generatie++;
  for (const tw of tweens) tw.res(); tweens.clear();
  for (const s of scherven) scene.remove(s.m); scherven.length = 0;
  for (const o of verdictObjecten) scene.remove(o); verdictObjecten = [];
  zetBudget(0); zetFocus(null); toon("");
  for (const l of Object.values(leden)) { l.avatar.scale.setScalar(1.35); l.kristal.scale.setScalar(1); l.draad.scale.setScalar(1); }
  koningKern.scale.setScalar(1);
  speel(generatie);
}

async function haal(pad) {
  try { const r = await fetch(pad, { cache: "no-store" }); return r.ok ? await r.json() : null; } catch { return null; }
}
async function laad() {
  const t = await haal("trace.json");
  if (t && Array.isArray(t.beurten)) {
    live = true; traceData = t; document.getElementById("foto").hidden = false; document.getElementById("naar2d").hidden = false;
    const v = await haal("verdict.json"); verdictData = v && v.run_id === t.run_id ? v : null;
  } else { traceData = INGEBED_TRACE; verdictData = INGEBED_VERDICT; }
  klaar = traceData.status !== "bezig";
  stappen = naarStappen(traceData);
  plaatsLeden(traceData.raadsleden || []);
  herstart();
  if (live) volg();
}
async function volg() {
  // Live run: nieuwe beurten komen achteraan de wachtrij.
  while (live) {
    await new Promise(r => setTimeout(r, 2000));
    const t = await haal("trace.json");
    if (!t || t.run_id !== traceData.run_id) { if (t && t.run_id !== traceData.run_id) { traceData = t; stappen = naarStappen(t); klaar = t.status !== "bezig"; verdictData = null; plaatsLeden(t.raadsleden || []); herstart(); } continue; }
    traceData = t; stappen = naarStappen(t); klaar = t.status !== "bezig";
    if (!verdictData) { const v = await haal("verdict.json"); if (v && v.run_id === t.run_id) verdictData = v; }
  }
}

// ---------- Camera en invoer ----------
const beperkt = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Breed scherm: camera dichterbij, zodat de zaal het beeld vult.
let az = 0.35, el = 0.5, afstand = innerWidth / innerHeight >= 1.5 ? 15.8 : 17.5, sleept = false, laatsteSleep = -1e9, px = 0, py = 0;
const doel = new THREE.Vector3(0, 1.8, 0);
const dom = renderer.domElement;
dom.addEventListener("pointerdown", e => { sleept = true; px = e.clientX; py = e.clientY; dom.setPointerCapture(e.pointerId); });
dom.addEventListener("pointerup", () => { sleept = false; laatsteSleep = performance.now(); });
dom.addEventListener("pointermove", e => {
  if (sleept) { az -= (e.clientX - px) * .006; el = Math.min(1.25, Math.max(.12, el + (e.clientY - py) * .004)); px = e.clientX; py = e.clientY; }
  wijs(e);
});
dom.addEventListener("wheel", e => { afstand = Math.min(28, Math.max(9, afstand + e.deltaY * .01)); e.preventDefault(); }, { passive: false });

const tip = document.getElementById("tip"), straal = new THREE.Raycaster(), muis = new THREE.Vector2();
function wijs(e) {
  muis.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  straal.setFromCamera(muis, camera);
  const doelen = [...Object.values(leden).map(l => l.avatar), koningKern];
  const raak = straal.intersectObjects(doelen)[0];
  if (raak) { tip.hidden = false; tip.textContent = NAMEN[raak.object.userData.rol || "koning"]; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; }
  else tip.hidden = true;
}

const speelKnop = document.getElementById("speel"), speelIc = document.getElementById("speel-ic");
speelKnop.onclick = () => {
  gepauzeerd = !gepauzeerd;
  speelIc.innerHTML = gepauzeerd ? '<path d="M7 5l12 7-12 7z"/>' : '<path d="M8 5v14M16 5v14"/>';
  speelKnop.setAttribute("aria-label", gepauzeerd ? "Afspelen" : "Pauzeren");
};
document.getElementById("opnieuw").onclick = () => { if (gepauzeerd) speelKnop.click(); herstart(); };
const tempoKnop = document.getElementById("tempo");
tempoKnop.onclick = () => { snelheid = snelheid === 1 ? 2 : snelheid === 2 ? 4 : 1; tempoKnop.textContent = snelheid + "×"; };
// Met het tekstpaneel rechts schuift de zaal naar links, zodat het midden vrij blijft.
function kader() {
  camera.aspect = innerWidth / innerHeight;
  const opzij = tekstAan && innerWidth > 720 ? Math.min(210, innerWidth * .16) : 0;
  camera.setViewOffset(innerWidth, innerHeight, opzij, 0, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio()); renderer.setSize(innerWidth, innerHeight);
  if (composer) { composer.setPixelRatio(pixelRatio()); composer.setSize(innerWidth, innerHeight); bloom.resolution.set(innerWidth, innerHeight); }
}
addEventListener("resize", kader);

// 4K-foto: render het huidige beeld op 3840×2160 en sla het op als PNG (alleen lokaal; de 3D-zaal zonder tekstpaneel).
function foto() {
  const B = 3840, H = 2160;
  camera.aspect = B / H; camera.clearViewOffset(); camera.updateProjectionMatrix();
  renderer.setPixelRatio(1); renderer.setSize(B, H, false);
  if (composer) { composer.setPixelRatio(1); composer.setSize(B, H); bloom.resolution.set(B, H); composer.render(); }
  else renderer.render(scene, camera);
  renderer.domElement.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `council-of-achrona-4k-${Date.now()}.png`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
  kader();
}
document.getElementById("foto").onclick = foto;
document.getElementById("tekstknop").addEventListener("click", kader);
kader();

// ---------- Renderlus ----------
const klok = new THREE.Clock(), tmp = new THREE.Vector3();
let tijd = 0;
function lus() {
  requestAnimationFrame(lus);
  const ruw = klok.getDelta();
  stap(Math.min(ruw, .05));
  pasKwaliteitAan(ruw);
  if (composer) composer.render(); else renderer.render(scene, camera);
}
// Adaptieve kwaliteit: meet elke 2 s de gemiddelde frametijd en past de resolutie (en zo nodig de gloed) aan.
let meetTijd = 0, meetFrames = 0, rustig = 0;
function pasKwaliteitAan(dt) {
  if (VIER_K || dt > .5) return; // tabblad was verborgen: niet meetellen
  meetTijd += dt; meetFrames++;
  if (meetTijd < 2) return;
  const ms = meetTijd / meetFrames * 1000; meetTijd = 0; meetFrames = 0;
  if (ms > 25) {
    rustig = 0;
    if (huidigPR > 1) { huidigPR = Math.max(1, +(huidigPR - .25).toFixed(2)); kader(); }
    else if (huidigPR > .75) { huidigPR = .75; kader(); }
    else if (bloom && bloom.enabled) bloom.enabled = false;
  } else if (ms < 14 && ++rustig >= 2) {
    rustig = 0;
    if (bloom && !bloom.enabled) bloom.enabled = true;
    else if (huidigPR < MAX_PR) { huidigPR = Math.min(MAX_PR, +(huidigPR + .25).toFixed(2)); kader(); }
  }
}
// ?t=60 spoelt 60 seconden door (bv. ?t=999 toont meteen het eindbeeld).
async function spring(seconden) {
  for (let i = 0; i < seconden * 30; i++) {
    stap(1 / 30);
    await new Promise(r => setTimeout(r, 0));
  }
}
function stap(dt) {
  if (!gepauzeerd) {
    const d = dt * 1000 * snelheid; tijd += dt * snelheid;
    for (const tw of [...tweens]) {
      if (tw.gen !== generatie) { tweens.delete(tw); tw.res(); continue; }
      tw.t += d; const p = Math.min(1, tw.t / tw.duur); tw.fn(p);
      if (p >= 1) { tweens.delete(tw); tw.res(); }
    }
  }
  if (!sleept && !beperkt && performance.now() - laatsteSleep > 2500) az += dt * .06;
  camera.position.set(doel.x + afstand * Math.cos(el) * Math.sin(az), doel.y + afstand * Math.sin(el), doel.z + afstand * Math.cos(el) * Math.cos(az));
  camera.lookAt(doel);

  koning.position.y = KONING_POS.y + Math.sin(tijd * 1.3) * .08;
  koning.rotation.y += dt * .3 * snelheid;
  koningGloed.material.opacity = .6 + Math.sin(tijd * 2) * .15;
  for (const l of Object.values(leden)) {
    const actief = focus === l.rol, gedimd = focus && !actief;
    l.halo.material.opacity += ((actief ? .85 : 0) - l.halo.material.opacity) * .08;
    l.vloer.material.opacity += ((actief ? .22 : 0) - l.vloer.material.opacity) * .08;
    l.avatar.material.opacity += ((gedimd ? .4 : 1) - l.avatar.material.opacity) * .08;
    l.sokkel.material.emissiveIntensity += ((actief ? .6 : .12) - l.sokkel.material.emissiveIntensity) * .08;
    l.avatar.position.y = 2.05 + Math.sin(tijd * 1.6 + l.fase) * .06;
    l.kristal.rotation.y += dt * .6 * snelheid; l.kristal.rotation.x += dt * .3 * snelheid;
    l.draad.rotation.y -= dt * .3 * snelheid;
    l.kristalGloed.material.opacity = (actief ? .8 : .3) + Math.sin(tijd * 2 + l.fase) * .08;
  }
  for (const s of scherven) {
    s.hoek += dt * s.v * .5 * (gepauzeerd ? 0 : snelheid);
    s.m.rotation.x += dt * 1.5; s.m.rotation.y += dt;
    if (s.vast) plekVan(s, s.m.position);
  }
}
(async () => {
  await laad();
  const sprong = Number(new URLSearchParams(location.search).get("t"));
  if (sprong > 0) await spring(Math.min(sprong, 300));
  klok.getDelta();
  lus();
})();
</script>
